version: '3.8'

services:
  inventory:
    build: .
    container_name: inventory-system
    ports:
      - "5000:5000"
    volumes:
      # 持久化数据库
      - ./instance:/app/instance
      # 持久化上传的图片
      - ./static/uploads:/app/static/uploads
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
