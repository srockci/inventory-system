{% extends "base.html" %}

{% block title %}用户管理{% endblock %}

{% block content %}
<h4 class="mb-4"><i class="bi bi-people"></i> 用户管理</h4>

<div class="row g-4">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-person-plus"></i> 添加用户
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('add_user') }}">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-plus-circle"></i> 添加
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-list"></i> 用户列表
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>用户名</th>
                                <th>创建时间</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for u in users %}
                            <tr>
                                <td>
                                    {{ u.username }}
                                    {% if u.username == 'admin' %}
                                    <span class="badge bg-primary ms-1">管理员</span>
                                    {% endif %}
                                </td>
                                <td>{{ u.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
