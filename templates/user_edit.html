{% extends "base.html" %}

{% block title %}编辑用户{% endblock %}

{% block content %}
<nav aria-label="breadcrumb mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('users') }}">用户管理</a></li>
        <li class="breadcrumb-item active">编辑用户</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-pencil"></i> 编辑用户</h5>
            </div>
            <div class="card-body">
                <form id="edit-user-form">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" id="username" class="form-control" value="{{ user.username }}" required>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> 保存
                        </button>
                        <a href="{{ url_for('users') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.querySelector('#edit-user-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData();
    formData.append('username', document.getElementById('username').value);
    
    try {
        const res = await fetch('{{ url_for("edit_user", user_id=user.id) }}', {
            method: 'POST',
            body: formData
        });
        if (res.redirected) {
            showToast('保存成功', true);
            setTimeout(() => window.location.href = res.url, 1000);
        } else {
            showToast('保存失败', false);
        }
    } catch (err) {
        showToast('操作失败: ' + err.message, false);
    }
});
</script>
{% endblock %}
