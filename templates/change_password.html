{% extends "base.html" %}

{% block title %}修改密码{% endblock %}

{% block content %}
<h4 class="mb-4"><i class="bi bi-key"></i> 修改密码</h4>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-key"></i> 修改密码
            </div>
            <div class="card-body">
                <form id="change-password-form">
                    <div class="mb-3">
                        <label class="form-label">原密码</label>
                        <input type="password" name="old_password" id="old_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">新密码</label>
                        <input type="password" name="new_password" id="new_password" class="form-control" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认新密码</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" required minlength="6">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> 保存
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Toast 提示 -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
    <div id="toast-result" class="toast" role="alert">
        <div class="toast-body"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.querySelector('#change-password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (newPassword !== confirmPassword) {
        const toast = document.getElementById('toast-result');
        toast.querySelector('.toast-body').innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> 两次密码输入不一致</span>';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
        return;
    }
    
    const formData = new FormData();
    formData.append('old_password', document.getElementById('old_password').value);
    formData.append('new_password', newPassword);
    formData.append('confirm_password', confirmPassword);
    
    try {
        const res = await fetch('{{ url_for("change_password") }}', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        
        const toast = document.getElementById('toast-result');
        
        if (data.success) {
            toast.querySelector('.toast-body').innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> ' + data.message + '</span>';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                window.location.href = '{{ url_for("index") }}';
            }, 2000);
        } else {
            toast.querySelector('.toast-body').innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> ' + data.message + '</span>';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    } catch (err) {
        alert('操作失败: ' + err.message);
    }
});
</script>
{% endblock %}
