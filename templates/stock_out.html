{% extends "base.html" %}

{% block title %}扫码出库{% endblock %}

{% block content %}
<h4 class="mb-4">
    <i class="bi bi-arrow-up-circle text-danger"></i> 扫码出库
</h4>

<!-- 导入功能 -->
<div class="card mb-3">
    <div class="card-header">
        <i class="bi bi-file-earmark-arrow-up"></i> 批量导入
    </div>
    <div class="card-body">
        <p class="text-muted small mb-2">上传 Excel 文件批量导入出库记录</p>
        <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#importModal">
            <i class="bi bi-upload"></i> 选择文件导入
        </button>
    </div>
</div>

<!-- 导入 Modal -->
<div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">批量导出入库</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>请上传 Excel 文件（.xlsx），格式要求：</p>
                <ul class="small">
                    <li>第1列：商品编码</li>
                    <li>第2列：数量</li>
                    <li>第3列：备注（可选）</li>
                </ul>
                <div class="alert alert-info small">
                    <a href="/static/template/stock_out_template.xlsx" download>下载模板文件</a>
                </div>
                <form id="importForm" enctype="multipart/form-data">
                    <input type="file" id="importFile" name="file" accept=".xlsx" class="form-control">
                </form>
                <div id="importResult" class="mt-3"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="importBtn">导入</button>
            </div>
        </div>
    </div>
</div>

<div class="row g-4">
    <!-- 左侧：扫码 + 商品选择 + 出库表单 -->
    <div class="col-lg-6">
        <div class="card mb-3">
            <div class="card-header">
                <i class="bi bi-qr-code-scan"></i> 扫码出库
            </div>
            <div class="card-body">
                <!-- 扫码区域 -->
                <div class="qr-scanner-container mb-3">
                    <video id="qr-video" playsinline autoplay></video>
                    <div id="qr-result">扫描中...</div>
                </div>
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-outline-primary" id="toggle-scan">
                        <i class="bi bi-camera"></i> 打开相机
                    </button>
                </div>
                
                <hr>
                
                <!-- 商品选择 -->
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label">选择分类</label>
                        <select id="category-select" class="form-select">
                            <option value="">全部分类</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label">选择商品</label>
                        <select id="product-select" class="form-select">
                            <option value="">请先选择分类</option>
                        </select>
                    </div>
                </div>
                
                <!-- 出库表单 -->
                <form id="stock-in-form">
                    <div class="mb-3">
                        <label class="form-label">商品编码</label>
                        <div class="input-group">
                            <input type="text" name="code" id="code-input" class="form-control" placeholder="扫码或选择商品">
                            <button type="button" class="btn btn-outline-secondary" id="clear-code">
                                <i class="bi bi-x"></i>
                            </button>
                        </div>
                        <div id="selected-product-info" class="mt-2 text-muted small" style="display: none;">
                            <span id="selected-product-name"></span>
                            <span class="ms-2">当前库存: <strong id="selected-product-stock"></strong></span>
                        </div>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label">数量 *</label>
                            <input type="number" name="quantity" id="quantity" class="form-control" min="1" required placeholder="出库数量" value="1">
                        </div>
                        <div class="col-6">
                            <label class="form-label">备注</label>
                            <input type="text" name="remark" class="form-control" placeholder="可选备注">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 mt-3">
                        <i class="bi bi-check-circle"></i> 确认出库
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <!-- 右侧：批量导入 -->
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-file-earmark-arrow-up"></i> 批量导入
            </div>
            <div class="card-body">
                <p class="text-muted small mb-3">上传 Excel 文件批量导入出库记录</p>
                <button type="button" class="btn btn-danger w-100" data-bs-toggle="modal" data-bs-target="#importModal">
                    <i class="bi bi-upload"></i> 选择文件导入
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 结果提示 -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
    <div id="toast-result" class="toast" role="alert">
        <div class="toast-body"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
// 所有商品数据（从后端传递）
const allProducts = [
    {% for p in products %}
    { code: '{{ p.code }}', name: '{{ p.name }}', stock: {{ p.current_stock }}, unit: '{{ p.unit }}', category_id: {{ p.category_id or 'null' }} }{% if not loop.last %},{% endif %}
    {% endfor %}
];

const categories = [
    {% for cat in categories %}
    { id: {{ cat.id }}, name: '{{ cat.name }}' }{% if not loop.last %},{% endif %}
    {% endfor %}
];

// 商品选择联动
document.getElementById('category-select').addEventListener('change', function() {
    const categoryId = this.value;
    const productSelect = document.getElementById('product-select');
    productSelect.innerHTML = '<option value="">请选择商品</option>';
    
    const filtered = categoryId 
        ? allProducts.filter(p => p.category_id == categoryId)
        : allProducts;
    
    filtered.forEach(p => {
        const option = document.createElement('option');
        option.value = p.code;
        option.textContent = `${p.name} (库存: ${p.stock})`;
        productSelect.appendChild(option);
    });
    
    if (filtered.length > 0) {
        productSelect.disabled = false;
    } else {
        productSelect.disabled = true;
    }
});

// 选择商品后填充编码
document.getElementById('product-select').addEventListener('change', function() {
    const code = this.value;
    const product = allProducts.find(p => p.code === code);
    
    if (product) {
        document.getElementById('code-input').value = product.code;
        document.getElementById('selected-product-name').textContent = product.name;
        document.getElementById('selected-product-stock').textContent = product.stock + ' ' + product.unit;
        document.getElementById('selected-product-info').style.display = 'block';
        document.getElementById('quantity').focus();
    } else {
        document.getElementById('selected-product-info').style.display = 'none';
    }
});

// 清除商品编码
document.getElementById('clear-code').addEventListener('click', function() {
    document.getElementById('code-input').value = '';
    document.getElementById('product-select').value = '';
    document.getElementById('selected-product-info').style.display = 'none';
});

// 扫码功能
let scanning = false;
let video = document.getElementById('qr-video');
let canvas = document.createElement('canvas');
let ctx = canvas.getContext('2d');
let animationId;

function toggleScan() {
    if (scanning) {
        stopScan();
    } else {
        startScan();
    }
}

function startScan() {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
            video.srcObject = stream;
            video.play();
            scanning = true;
            document.getElementById('toggle-scan').innerHTML = '<i class="bi bi-camera-off"></i> 关闭相机';
            scanFrame();
        })
        .catch(err => {
            showToast('无法访问相机: ' + err.message, false);
        });
}

function stopScan() {
    if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
    }
    if (animationId) {
        cancelAnimationFrame(animationId);
    }
    scanning = false;
    document.getElementById('toggle-scan').innerHTML = '<i class="bi bi-camera"></i> 打开相机';
    document.getElementById('qr-result').textContent = '扫描中...';
}

function scanFrame() {
    if (!scanning) return;
    
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let code = jsQR(imageData.data, imageData.width, imageData.height);
        
        if (code) {
            document.getElementById('qr-result').textContent = '扫描成功: ' + code.data;
            document.getElementById('code-input').value = code.data;
            stopScan();
            
            // 自动查找商品信息
            const product = allProducts.find(p => p.code === code.data.replace('INV:', ''));
            if (product) {
                document.getElementById('selected-product-name').textContent = product.name;
                document.getElementById('selected-product-stock').textContent = product.stock + ' ' + product.unit;
                document.getElementById('selected-product-info').style.display = 'block';
                document.getElementById('quantity').focus();
            }
            
            return;
        }
    }
    
    animationId = requestAnimationFrame(scanFrame);
}

document.getElementById('toggle-scan').addEventListener('click', toggleScan);

// 提交表单
document.querySelector('#stock-in-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    
    try {
        const res = await fetch('{{ url_for("do_stock_out") }}', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        
        const toast = document.getElementById('toast-result');
        
        if (data.success) {
            toast.querySelector('.toast-body').innerHTML = '<span class="text-danger"><i class="bi bi-check-circle"></i> ' + data.message + '</span>';
            e.target.reset();
            document.getElementById('selected-product-info').style.display = 'none';
            document.getElementById('product-select').value = '';
        } else {
            toast.querySelector('.toast-body').innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> ' + data.message + '</span>';
        }
        
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    } catch (err) {
        showToast('操作失败: ' + err.message, false);
    }
});

// 导入功能
document.getElementById('importBtn').addEventListener('click', async () => {
    const fileInput = document.getElementById('importFile');
    const resultDiv = document.getElementById('importResult');
    
    if (!fileInput.files[0]) {
        resultDiv.innerHTML = '<div class="alert alert-warning">请选择文件</div>';
        return;
    }
    
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    
    try {
        const res = await fetch('{{ url_for("import_stock_out") }}', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        
        if (data.success) {
            resultDiv.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle"></i> ' + data.message + '</div>';
            setTimeout(() => location.reload(), 1500);
        } else {
            let html = '<div class="alert alert-danger"><i class="bi bi-x-circle"></i> ' + data.message;
            if (data.errors && data.errors.length > 0) {
                html += '<ul class="mb-0 mt-2">' + data.errors.map(e => '<li>' + e + '</li>').join('') + '</ul>';
            }
            html += '</div>';
            resultDiv.innerHTML = html;
        }
    } catch (err) {
        resultDiv.innerHTML = '<div class="alert alert-danger">导入失败: ' + err.message + '</div>';
    }
});
</script>
{% endblock %}
