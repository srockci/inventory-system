{% extends "base.html" %}

{% block title %}重置密码 - {{ user.username }}{% endblock %}

{% block content %}
<nav aria-label="breadcrumb mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('users') }}">用户管理</a></li>
        <li class="breadcrumb-item active">重置密码</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-key"></i> 重置密码 - {{ user.username }}</h5>
            </div>
            <div class="card-body">
                <form id="reset-password-form">
                    <div class="mb-3">
                        <label class="form-label">新密码</label>
                        <input type="password" name="password" id="password" class="form-control" required minlength="6" placeholder="至少6位">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认密码</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" required minlength="6" placeholder="再次输入新密码">
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-circle"></i> 重置密码
                        </button>
                        <a href="{{ url_for('users') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 结果提示 -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
    <div id="toast-result" class="toast" role="alert">
        <div class="toast-body"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.querySelector('#reset-password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (password !== confirmPassword) {
        const toast = document.getElementById('toast-result');
        toast.querySelector('.toast-body').innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> 两次密码输入不一致</span>';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
        return;
    }
    
    const formData = new FormData();
    formData.append('password', password);
    
    try {
        const res = await fetch('{{ url_for("reset_user_password", user_id=user.id) }}', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        
        const toast = document.getElementById('toast-result');
        
        if (data.success) {
            toast.querySelector('.toast-body').innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> ' + data.message + '</span>';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                window.location.href = '{{ url_for("users") }}';
            }, 2000);
        } else {
            toast.querySelector('.toast-body').innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> ' + data.message + '</span>';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    } catch (err) {
        alert('操作失败: ' + err.message);
    }
});
</script>
{% endblock %}
